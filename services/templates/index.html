<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AudioNotebook PDF - IA Estudio</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f4f9; }
        #sidebar { width: 260px; background: #2c3e50; color: #ecf0f1; padding: 20px; overflow-y: auto; }
        #content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        #qa-panel { width: 320px; background: #ffffff; border-left: 2px solid #e0e0e0; display: flex; flex-direction: column; padding: 20px; }
        
        .chapter-item { padding: 10px; margin: 5px 0; background: #34495e; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .chapter-item.active { background: #1abc9c; }
        
        .controls { position: sticky; top: 0; background: #fff; padding: 15px; border-bottom: 2px solid #ddd; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        .paragraph { padding: 8px; margin-bottom: 8px; border-radius: 4px; line-height: 1.6; }
        .paragraph.reading { background-color: #ffeaa7; font-weight: bold; }
        
        /* Panel de Preguntas */
        #chatBox { flex: 1; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin-bottom: 15px; background: #fafafa; }
        .chat-msg { margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
        .chat-msg.user { font-weight: bold; color: #2980b9; }
        .chat-msg.ai { color: #2c3e50; background: #eef2f7; padding: 8px; border-radius: 6px; }
        .chat-input-area { display: flex; gap: 5px; }
        .chat-input-area input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; font-size: 14px; cursor: pointer; background: #1abc9c; color: white; border: none; border-radius: 4px; }
        button:hover { background: #16a085; }
    </style>
</head>
<body>

    <!-- Panel Izquierdo: Libros y Capítulos -->
    <div id="sidebar">
        <h2>📚 Libros</h2>
        <select id="bookSelect" style="width: 100%; padding: 8px; margin-bottom: 20px;">
            {% for b in books %}
                <option value="{{ b[0] }}">{{ b[1] }}</option>
            {% endfor %}
        </select>
        
        <h3>Capítulos</h3>
        <div id="chapterList"></div>
    </div>

    <!-- Panel Central: Lectura en Voz Alta -->
    <div id="content">
        <div class="controls">
            <button id="btnPlay">▶️ Leer Capítulo</button>
            <button id="btnPause">⏸️ Pausar</button>
            <label>Voz: <select id="voiceSelect"></select></label>
            <label>Velocidad: <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1"></label>
        </div>

        <h1 id="chapterTitle">Selecciona un libro para comenzar</h1>
        <div id="textContainer"></div>
    </div>

    <!-- Panel Derecho: Preguntas y Respuestas IA -->
    <div id="qa-panel">
        <h3>💬 Consultas del Capítulo</h3>
        <p style="font-size: 12px; color: #7f8c8d;">Hazle preguntas a Gemini sobre el texto que estás escuchando.</p>
        
        <div id="chatBox"></div>

        <div class="chat-input-area">
            <input type="text" id="questionInput" placeholder="Ej: ¿Cuál es la idea principal?" onkeypress="if(event.key==='Enter') askAI()">
            <button onclick="askAI()">Enviar</button>
        </div>

        <!-- BOTÓN SIEMPRE VISIBLE Y ACTIVO -->
        <button id="btnReadAnswer" style="margin-top: 10px; background: #3498db; width: 100%; cursor: pointer;" onclick="speakAIAnswer()">
            🔊 Leer Respuesta de IA
        </button>
    </div>

    <script>
        let currentParagraphs = [];
        let currentIndex = 0;
        let activeChapterId = null;
        let lastAiAnswer = "";
        let synth = window.speechSynthesis;
        let utterance = null;

        function loadVoices() {
            let voices = synth.getVoices();
            let voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';
            voices.forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                if (v.lang.includes('es')) opt.selected = true;
                voiceSelect.appendChild(opt);
            });
        }
        synth.onvoiceschanged = loadVoices;

        document.getElementById('bookSelect').addEventListener('change', function() {
            loadChapters(this.value);
        });

        function loadChapters(bookId) {
            fetch(`/book/${bookId}/chapters`)
                .then(r => r.json())
                .then(data => {
                    let list = document.getElementById('chapterList');
                    list.innerHTML = '';
                    data.chapters.forEach(c => {
                        let div = document.createElement('div');
                        div.className = `chapter-item ${c.id === data.current_chapter_id ? 'active' : ''}`;
                        div.textContent = `📖 [${c.number}] ${c.title}`;
                        div.onclick = () => loadChapterContent(c.id);
                        list.appendChild(div);
                    });
                    if (data.current_chapter_id) loadChapterContent(data.current_chapter_id);
                });
        }

        function loadChapterContent(chapId) {
            activeChapterId = chapId;
            synth.cancel();
            document.getElementById('chatBox').innerHTML = ''; // Limpiar chat al cambiar capítulo

            fetch(`/chapter/${chapId}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('chapterTitle').textContent = data.title;
                    let container = document.getElementById('textContainer');
                    container.innerHTML = '';
                    currentParagraphs = data.paragraphs;
                    currentIndex = 0;

                    currentParagraphs.forEach((pText, i) => {
                        let p = document.createElement('p');
                        p.className = 'paragraph';
                        p.id = `para-${i}`;
                        p.textContent = pText;
                        p.onclick = () => { currentIndex = i; speakCurrent(); };
                        container.appendChild(p);
                    });
                });
        }

        function speakCurrent() {
            synth.cancel();
            if (currentIndex >= currentParagraphs.length) return;

            document.querySelectorAll('.paragraph').forEach(el => el.classList.remove('reading'));
            let currentEl = document.getElementById(`para-${currentIndex}`);
            if (currentEl) {
                currentEl.classList.add('reading');
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            utterance = new SpeechSynthesisUtterance(currentParagraphs[currentIndex]);
            let voices = synth.getVoices();
            let selectedVoice = document.getElementById('voiceSelect').value;
            utterance.voice = voices.find(v => v.name === selectedVoice);
            utterance.rate = parseFloat(document.getElementById('rate').value);

            utterance.onend = () => {
                currentIndex++;
                speakCurrent();
            };

            synth.speak(utterance);
        }

        // --- LÓGICA DE PREGUNTAS IA ---
        function askAI() {
            let input = document.getElementById('questionInput');
            let q = input.value.trim();
            if (!q || !activeChapterId) return;

            let chatBox = document.getElementById('chatBox');
            let btnRead = document.getElementById('btnReadAnswer');

            // Cambiar estado visual mientras carga
            btnRead.innerText = "⏳ Generando respuesta...";
            
            chatBox.innerHTML += `<div class="chat-msg user"><b>Tú:</b> ${q}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            chatBox.innerHTML += `<div class="chat-msg ai" id="loadingMsg"><i>Pensando con Gemini...</i></div>`;

            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chapter_id: activeChapterId, question: q })
            })
            .then(r => r.json())
            .then(data => {
                let loadingMsg = document.getElementById('loadingMsg');
                if (loadingMsg) loadingMsg.remove();

                if (data.answer) {
                    lastAiAnswer = data.answer;
                    chatBox.innerHTML += `<div class="chat-msg ai"><b>Gemini:</b> ${data.answer}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="chat-msg ai" style="color:red;">Error: ${data.error}</div>`;
                }
                
                btnRead.innerText = "🔊 Leer Respuesta de IA";
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(err => {
                let loadingMsg = document.getElementById('loadingMsg');
                if (loadingMsg) loadingMsg.remove();
                chatBox.innerHTML += `<div class="chat-msg ai" style="color:red;">Error de conexión.</div>`;
                btnRead.innerText = "🔊 Leer Respuesta de IA";
            });
        }

        function speakAIAnswer() {
            if (!lastAiAnswer) {
                alert("Aún no hay una respuesta de la IA para leer.");
                return;
            }

            synth.cancel();

            // Limpieza de símbolos por si acaso
            let cleanText = lastAiAnswer
                .replace(/[\*\_~`#]/g, '')
                .replace(/\|/g, ', ')
                .replace(/<[^>]*>/g, '')
                .replace(/\n+/g, '. ');

            let utt = new SpeechSynthesisUtterance(cleanText);
            let voices = synth.getVoices();
            let selectedVoice = document.getElementById('voiceSelect').value;
            
            let matchedVoice = voices.find(v => v.name === selectedVoice);
            if (matchedVoice) utt.voice = matchedVoice;
            
            utt.rate = parseFloat(document.getElementById('rate').value);

            synth.speak(utt);
        }
    </script>
</body>
</html>
